title: Telkom Labs
description: Applied Research for Internet infrastructure.
lang: en

# Served at the custom domain in CNAME (set under Settings → Pages), from the domain root.
url: "https://telkomlabs.org"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  publications:
    output: true
    permalink: /research/:name/
  # Products are listed on the Projects page only, with no page of their own: a product with its own site links
  # to it, and a retired one is shown greyed out.
  projects:
    output: false

defaults:
  - scope: { path: "", type: publications }
    values: { layout: paper, section: research }
  - scope: { path: "", type: projects }
    values: { layout: null, section: projects }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
