title: Telkom Labs
description: Applied AI for Internet infrastructure.
lang: en

# Served at the custom domain in CNAME (set under Settings → Pages), from the domain root.
url: "https://telkomlabs.org"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  publications:
    output: true
    permalink: /research/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: publications }
    values: { layout: paper, section: research }
  - scope: { path: "", type: projects }
    values: { layout: project, section: projects }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
